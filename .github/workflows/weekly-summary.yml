name: Weekly Failure Summary

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run validate
      - run: npm run summarize
      - run: npm run promote-rule
      - name: Show summary
        run: cat reports/summary.md
